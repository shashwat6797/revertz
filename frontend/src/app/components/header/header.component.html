<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200/80">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-18">
      <!-- Product Name & Brand Logo -->
      <a href="#" class="flex items-center gap-2.5 group" aria-label="Revertz Home">
        <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white shadow-sm shadow-emerald-200 group-hover:bg-emerald-700 transition">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <span class="text-xl font-bold tracking-tight text-slate-900">Revertz</span>
          <span class="text-[10px] font-medium tracking-wide uppercase text-emerald-600">Clinic Management</span>
        </div>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center gap-8" aria-label="Main Navigation">
        <a href="#features" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition">Features</a>
        <a href="#how-it-works" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition">How it works</a>
        <a href="#clinics" class="text-sm font-medium text-slate-600 hover:text-emerald-600 transition">For Clinics</a>
      </nav>

      <!-- Desktop CTA Button -->
      <div class="hidden md:flex items-center">
        <a
          href="#cta"
          class="inline-flex items-center justify-center px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm shadow-emerald-200 transition focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2"
        >
          Get Started
        </a>
      </div>

      <!-- Mobile Hamburger Button -->
      <button
        type="button"
        (click)="toggleMobileMenu()"
        class="md:hidden p-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition focus:outline-none focus:ring-2 focus:ring-emerald-500"
        aria-label="Toggle navigation menu"
        [attr.aria-expanded]="isMobileMenuOpen()"
      >
        @if (!isMobileMenuOpen()) {
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        } @else {
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- Mobile Dropdown Menu -->
  @if (isMobileMenuOpen()) {
    <nav class="md:hidden border-t border-slate-200 bg-white px-4 pt-3 pb-5 space-y-3" aria-label="Mobile Navigation">
      <a
        href="#features"
        (click)="closeMobileMenu()"
        class="block py-2 text-base font-medium text-slate-700 hover:text-emerald-600"
      >
        Features
      </a>
      <a
        href="#how-it-works"
        (click)="closeMobileMenu()"
        class="block py-2 text-base font-medium text-slate-700 hover:text-emerald-600"
      >
        How it works
      </a>
      <a
        href="#clinics"
        (click)="closeMobileMenu()"
        class="block py-2 text-base font-medium text-slate-700 hover:text-emerald-600"
      >
        For Clinics
      </a>
      <div class="pt-2">
        <a
          href="#cta"
          (click)="closeMobileMenu()"
          class="block w-full text-center py-2.5 px-4 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg shadow-sm"
        >
          Get Started
        </a>
      </div>
    </nav>
  }
</header>
